<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jaipur Design Festival Programme</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#fff;--ink:#1d1b3a;--mute:#6b6a80;--line:#e6e3ee;--field:#faf9fd;--forum:#2b2a6b;--forum-t:#fff;--break:#f1eef6;--break-t:#4a4863;--work:#f6b73c;--work-t:#3a2600;--exh:#e4467c;--exh-t:#fff;--cult:#0f766e;--cult-t:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14132a;--ink:#ecebf7;--mute:#a09fb8;--line:#2d2b4d;--field:#1d1c3a;--forum:#5b59d6;--break:#24224a;--break-t:#c9c7e4;--cult:#2bb3a6;--cult-t:#04302b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14132a;--ink:#ecebf7;--mute:#a09fb8;--line:#2d2b4d;--field:#1d1c3a;--forum:#5b59d6;--break:#24224a;--break-t:#c9c7e4;--cult:#2bb3a6;--cult-t:#04302b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'DM Sans',system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font:700 clamp(26px,5vw,40px)/1.1 'Bricolage Grotesque',system-ui,sans-serif;margin:0 0 6px;outline:none}
.sub{color:var(--mute);margin:0 0 20px;outline:none}
[contenteditable]:focus{box-shadow:0 0 0 2px var(--exh);border-radius:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{font:500 15px 'DM Sans',system-ui,sans-serif;background:none;color:var(--mute);border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--exh)}
.hs{overflow-x:auto;border-bottom:1px solid var(--line)}
.hg{position:relative}
.hh{position:relative;height:26px;margin-left:104px}
.hh span{position:absolute;top:6px;transform:translateX(-50%);font-size:12px;color:var(--mute);white-space:nowrap}
.hr{display:flex;border-top:1px solid var(--line)}
.vl{position:sticky;left:0;z-index:2;flex:none;width:104px;padding:8px 8px 8px 4px;font:500 13px 'DM Sans',sans-serif;color:var(--mute);background:var(--bg);display:flex;align-items:center}
.hp{position:relative;flex:none}
.blk{position:absolute;border-radius:8px;padding:6px 10px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:1px}
.blk b{font:700 17px/1.2 'Bricolage Grotesque',system-ui,sans-serif}
.blk.has b{font-size:15px}
.blk small{font-size:12px;opacity:.85}
.blk .d{font-size:12px;line-height:1.3;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.forum{background:var(--forum);color:var(--forum-t)}
.break{background:var(--break);color:var(--break-t)}.break b{font-weight:500;font-size:15px}
.work{background:var(--work);color:var(--work-t)}
.exh{background:var(--exh);color:var(--exh-t)}
.cult{background:var(--cult);color:var(--cult-t)}
.blk.nar{padding:4px 6px}
.blk.nar b{font-size:12px;line-height:1.15;overflow-wrap:anywhere}
.blk.nar small,.blk.nar .d{display:none}
.empty{color:var(--mute);padding:24px 0}
.edit{margin-top:32px;border-top:1px solid var(--line);padding-top:16px}
.edit h2{font:700 18px 'Bricolage Grotesque',sans-serif;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
input,select,textarea{font:400 14px 'DM Sans',sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--exh);outline-offset:0}
.t{flex:2 1 180px}.v{flex:1 1 130px}.k{flex:0 0 auto}.tm{flex:0 0 auto}
.row .f{flex:1 1 140px}.row .d{flex:2 1 220px}
.x,.add{font:500 14px 'DM Sans',sans-serif;background:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
.x:hover,.add:hover{border-color:var(--exh)}
.err{color:#d6336c;font-size:12px;flex-basis:100%}
.add{margin-top:12px}
.note{color:var(--mute);font-size:13px;margin:12px 0 0}
.wn{color:var(--mute);font-size:13px;margin:0 0 4px}
.wg{font:700 18px 'Bricolage Grotesque',sans-serif;margin:24px 0 8px}
.wk{border:1px solid var(--line);border-radius:10px;margin:0 0 8px;background:var(--bg)}
.wk summary{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
.wk summary::-webkit-details-marker{display:none}
.wk summary:focus-visible{outline:2px solid var(--exh);outline-offset:2px;border-radius:10px}
.wk[open] summary{border-bottom:1px solid var(--line)}
.wc{flex:none;font:700 13px 'DM Sans',sans-serif;background:var(--work);color:var(--work-t);border-radius:6px;padding:2px 8px}
.wt{display:flex;flex-direction:column;min-width:0;gap:1px}
.wt b{font:700 17px/1.25 'Bricolage Grotesque',system-ui,sans-serif}
.wt span{color:var(--mute);font-size:13px}
.wb{padding:14px;max-width:760px}
.wb p{margin:0 0 10px}
.wb .lead{font-weight:500}
.wb h4{font:700 14px 'Bricolage Grotesque',sans-serif;margin:16px 0 6px}
.wm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;margin:0 0 14px}
.wm div{min-width:0}
.wm dt{font-size:12px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.wm dd{margin:0}
.bl{margin:0 0 10px;padding-left:20px}
.bl li{margin:0 0 4px}
.wl{color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.wb a{color:var(--ink)}
.lnk{font:500 14px 'DM Sans',sans-serif;background:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;margin-top:6px}
.lnk:hover{border-color:var(--exh)}
[hidden]{display:none!important}
.hint{color:var(--mute);font-size:13px;margin:12px 0 0}
.blk{cursor:pointer}
.blk:focus-visible{outline:2px solid var(--exh);outline-offset:2px}
.blk:hover{filter:brightness(1.06)}
.dlg{position:fixed;inset:0;z-index:20;background:rgba(10,9,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.panel{position:relative;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;max-height:100%;overflow-y:auto;padding:24px 20px 20px}
.dclose{position:absolute;top:12px;right:12px;font:500 14px 'DM Sans',sans-serif;background:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.dclose:hover{border-color:var(--exh)}
.chip{display:inline-block;font-size:12px;font-weight:500;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.panel h3{font:700 22px/1.2 'Bricolage Grotesque',system-ui,sans-serif;margin:0 56px 4px 0;text-wrap:balance}
.panel .dm{color:var(--mute);font-size:13px;margin:0 0 12px}
.panel p{margin:0 0 10px}
.panel ul{list-style:none;margin:12px 0 0;padding:0}
.panel li{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) minmax(0,1fr);gap:4px 16px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.panel li b{font-weight:500}
.panel li span{color:var(--mute)}
.panel li em{font-style:normal}
@media (max-width:640px){.panel li{grid-template-columns:minmax(0,1fr)}}
@media print{.tabs,.dlg,.hint{display:none}.hs{overflow:visible}.wk>*{display:block}}
</style>
</head><body>
<div class="wrap">
<h1 id="h1">Jaipur Design Festival 2026</h1>
<p class="sub" id="sub">Programme · 16–18 November 2026</p>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="grid"></div>
<div class="dlg" id="dlg" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="dtitle"><button class="dclose" id="dclose" aria-label="Close details">Close</button><div id="dbody"></div></div></div>
<p class="hint">Select a session to see its details.</p>
</div>
<script>
var KEY='jdf-schedule-v3',ALL='All venues',cur=0,VO=['Krishnayan','Surekh','Sudarshan','Madhyavarti','Alankar','Sukriti'];
var KINDS={forum:'Forum or talk',work:'Workshop',exh:'Exhibition',cult:'Cultural programme',break:'Break'};
function S(t,v,k,s,e,f,d,p,w){return{t:t,v:v,k:k,s:s,e:e,f:f||'',d:d||'',p:p||'',w:w||''}}
var state={title:'Jaipur Design Festival 2026',sub:'Programme · 16–18 November 2026',days:[
{label:'Mon 16 Nov',sessions:[S('Forum 1: Education by Design','Krishnayan','forum','10:00','13:00','','Learn, Teach, & Prepare for future',"This forum explores how design education can move beyond teaching skills and techniques to develop observation, curiosity, critical thinking, empathy, experimentation, collaboration and the ability to work with complexity.\nKeynote||Can design change the way we learn, teach and prepare for the future?||Mr. Jinan KB\nDesigning the Learner, Not Just the Classroom||How can design thinking, making and problem-solving transform school education?||Ms. Manisha Mohan\nFrom Rote to Creative Intelligence||Creativity, critical thinking, AI and the skills young people will need for an uncertain future.||Mr. Sandeep Sethi\nLearning from the Real World||How schools, design institutes, industry, craftspeople and communities can become learning ecosystems.||Mr. Phani Tetali\nModerator||||Ms. Lolita Dutta"),S('Networking lunch','Sukriti','break','13:00','14:00'),S('Forum 2: Circular Jaipur','Krishnayan','forum','14:00','17:00','','Sustainability and circularity',"This forum looks at the possibility of moving from a linear model of take–make–use–discard towards circular ways of designing, producing and consuming. Rather than treating sustainability as an isolated environmental concern, the forum asks how circular thinking can become embedded in the everyday functioning of the city—and how designers can help create systems that are economically viable, socially inclusive and regenerative.\nKeynote||Can we design a city where nothing is wasted?||Mr. Dileep Baid\nWaste is a Design Failure||Rethinking packaging, consumption, segregation, recycling and the systems that create waste.||Mr. Gaurav Shorey\nThe Second Life of Things||Upcycling, repair, reuse, material innovation and the new circular economy.||Mr. Radhesh Agrahari\nDesigning a Regenerative City||Can waste become a resource for livelihoods, public spaces, architecture and industry?||Dr. Vivek S. Agrawal\nModerator||||Ms. Meenakshi Singh"),S('Networking tea','Sukriti','break','17:00','18:00'),S('Workshop 1: The Art of Seeing','Surekh','work','10:00','13:00','Keya Vaswani','Film Making (Visual Story Telling, Mobile film making & Editing)','','W01'),S('Workshop 2: 50 Seats, 50 Stories (Session 1)','Surekh','work','14:00','17:00','Sana Soni','Full-scale papier-mâché coffee table. Session 1: Form development','','W02'),S('Workshop 3: Designed storytelling using five senses','Surekh','work','14:00','17:00','Mannat Bardia, Priyanshi Khatri','Observe, interpret, and communicate stories through multiple sensory layers','','W03'),S('Workshop 11: The Power of Color with Pantone','Sudarshan','work','15:00','17:00','Ankita Kothari','Pantone India','','W11'),S("Drum Circle",'Madhyavarti','cult','18:00','18:45',"Manu · Founder, Drum Circle India","Pink Noise","Pink Noise — A Cultural Programme of Jaipur Design Festival 2026, led by ADI, Jaipur Chapter. An immersive celebration of music, culture and collective expression, Pink Noise brings together traditional art forms and contemporary sound experiences.\nA celebration of rhythm, connection and collective expression, Drum Circle invites audiences to experience the joy of making music together.\nLed by Manu, who has facilitated over 650 drum circles across India, including a special session for UN Women in 2024, this participatory experience brings people together through spontaneous music-making, with no prior musical experience required.\nCome together. Find your rhythm. Become part of the music."),S("Gaalibaazi: The Voice of Jaipur",'Madhyavarti','cult','19:00','20:00',"Sandeep Ratnoo & Kailash God","Pink Noise","Pink Noise — A Cultural Programme of Jaipur Design Festival 2026, led by ADI, Jaipur Chapter. An immersive celebration of music, culture and collective expression, Pink Noise brings together traditional art forms and contemporary sound experiences.\nA vibrant celebration of Jaipur’s folk traditions, Gaalibaazi brings together witty wordplay, satire, poetry and live folk music to tell the story of the Pink City.\nDating back to the 19th century, this distinctive tradition was performed in Jaipur’s old city, where spontaneous poetic exchanges offered humorous commentary on society and everyday life.\nCurated by Sandeep Ratnoo, the performance features a five-member musical ensemble and senior traditional artist Kailash God. Through original compositions and visual storytelling, it journeys from Jaipur’s founding to its evolving identity today.\nA celebration of Jaipur’s heritage, humour and contemporary identity."),S('Open exhibition','Alankar','exh','11:00','21:00')]},
{label:'Tue 17 Nov',sessions:[S('Networking tea','Sukriti','break','09:00','10:00'),S('Forum 3: Crafting Identity','Krishnayan','forum','10:00','13:00','','',"Jaipur's identity is deeply connected to its crafts, materials, techniques, architecture, textiles, jewellery, visual culture and communities of makers. This forum explores how craft and cultural knowledge can remain economically viable, relevant and meaningful while evolving for contemporary life. The larger question is how Jaipur can celebrate its cultural richness without turning it into a museum piece—and how design can help craft become a living, evolving and future-facing part of the city's identity and economy.\nKeynote||How can design help Jaipur's craft, culture and identity remain alive rather than simply preserved?||Ms. Mamta Mansingka\nFrom Craft to Contemporary||How can traditional skills evolve into products, experiences and ideas relevant to today's world?||Ms. Geetanjali Kasliwal\nWho Owns a Culture?||Authenticity, appropriation, intellectual property and the ethics of using cultural traditions in contemporary design.||Ms. Meera Goradia, Mr. Ishwar Singh\nDesigning the Jaipur Brand||Beyond pink buildings and tourism clichés—what should Jaipur's visual and cultural identity be in the future?||Mr. Chandrashekhar Bheda\nModerator||||Mr. Niraj Shah"),S('Networking lunch','Sukriti','break','13:00','14:00'),S('Forum 4: The City We Make','Krishnayan','forum','14:00','17:00','','',"This forum asks: What kind of Jaipur are we collectively making? It opens a conversation around public spaces, mobility, architecture, housing, infrastructure, heritage, streets, neighbourhoods and the relationship between the historic city and its expanding contemporary landscape. Speakers can examine how design can make the city more accessible, liveable, inclusive and responsive to its people while respecting its distinctive character.\nKeynote||Who gets to design the city and what kind of Jaipur do we want to create?||Mr. Naresh Narsimhan\nA City for People||Inclusive, accessible, climate-responsive and beautiful neighbourhoods—and the role of designers in creating them.||Ms. Manisha Sharma\nOld City, New Life||How can heritage and contemporary life coexist without turning heritage into a museum?||Mr. Gagan Sharma\nWho Owns the Street?||Designing streets and public spaces for pedestrians, vendors, children, cyclists, cars and communities.||Ms. Kavita Jain\nModerator||||Ms. Preethi Agrawal"),S('Networking tea','Sukriti','break','17:00','18:00'),S('Workshop 4: Stories in Thread','Surekh','work','10:00','13:00','Sana Soni','Embroidery workshop','','W04'),S('Workshop 5: Character design and Storytelling','Surekh','work','14:00','17:00','Phani Tetali','Approach towards character design as an integral tool in storytelling','','W05'),S('Workshop 6: Learning from Children','Surekh','work','10:00','13:00','Jinan K. B.','Retaining the Designer in the Child; Reawakening the Child in the Adult','','W06'),S('Workshop 7: the AHA MOMENT','Surekh','work','14:00','17:00','Niraj Shah','Creative Thinking Workshop','','W07'),S("Jal Jungle Zameen",'Madhyavarti','cult','18:30','20:00',"Elsewhere in India · Gopika Jairam, Murthovic & Avinash","Pink Noise","Pink Noise — A Cultural Programme of Jaipur Design Festival 2026, led by ADI, Jaipur Chapter. An immersive celebration of music, culture and collective expression, Pink Noise brings together traditional art forms and contemporary sound experiences.\nA compelling fusion of electronic music, traditional Rajasthani sounds and immersive digital art, Jal Jungle Zameen explores India’s ecological heritage through sound, moving image and digital environments.\nDrawing on Rajasthan’s hereditary musical traditions, the performance features the kamaycha, morchang, bhapang, khadtal and dholak, reimagined through contemporary electronica and digital storytelling.\nThe creative team includes electronic music producer Murthovic and multidisciplinary artist Avinash Kumar (Thiruda), whose acclaimed work Elsewhere in India was selected for the 2023 BFI London Film Festival. Their work brings together digital art, game-engine technology and Indian cultural heritage.\nAn immersive journey through cultural memory, ecological wisdom and the meeting of tradition and technology."),S('Open exhibition','Alankar','exh','11:00','21:00'),S('enCODE Mentor Connect','Sudarshan','work','09:00','18:00')]},
{label:'Wed 18 Nov',sessions:[S('Networking tea','Sukriti','break','09:00','10:00'),S('Forum 5: Design Industry & Enterprise','Krishnayan','forum','10:00','13:00','','',"This forum explores how stronger connections between designers, businesses, manufacturers, entrepreneurs, craft communities and institutions can create new value for Jaipur's economy and strengthen its creative ecosystem. It can also explore the opportunities for designers to become entrepreneurs and for industry to engage more meaningfully with design education and emerging talent. With Jaipur's strengths in craft, textiles, jewellery, furniture, hospitality, tourism, manufacturing and creative enterprise, the forum asks how the city can develop a more visible and connected design-led economy.\nKeynote||Can design become a powerful engine for business, entrepreneurship and Jaipur's creative economy?||Ms. Leela Bordia\nJaipur to the World — Creating a Competitive Creative Economy||How can Jaipur leverage its strengths in craft, textiles, jewellery, furniture, architecture, hospitality, tourism and creative enterprise to build businesses and brands with national and global relevance||Mr. Ayush Kasliwal\nFrom Designer to Entrepreneur- Building the Next Generation of Design-led Businesses||Understanding how can designers turn creative ideas into viable brands, products, services and intellectual property.||Mr. Chintan Bakshi\nDesign as a Business Strategy||Exploring product development, brand building, customer experience, service design and the role of designers in business decision-making||Ms. Shilpa Sharma\nModerator||||Ms. Sonal Chitranshi"),S('Networking lunch','Sukriti','break','13:00','14:00'),S('Forum 6: The Future of Design','Krishnayan','forum','14:00','17:00','','',"Design itself is changing rapidly. This forum looks ahead and asks what the profession might become and what responsibilities designers will carry in a world of accelerating change. Rather than predicting a single future, the forum aims to open a conversation about multiple possible futures and the role designers can play in shaping them consciously and responsibly.\nKeynote||When AI can design, generate and make almost anything, what is the role of the human designer?||Mr. Ayaz Basrai\nWhat Should We Design?||Moving from designing more things to designing better systems, experiences, relationships and futures.||Mr. Sujay Zwende\nDesigning for a World We Cannot Predict||Climate change, new technologies, demographic shifts and radically changing lifestyles||Mr. Nevadan Rathi\nDesign After AI||What happens to creativity, authorship and the role of the designer when machines can generate?||Mr. Sukanto Roy\nModerator||||Ms. Keya Vaswani"),S('Networking tea','Sukriti','break','17:00','18:00'),S('Workshop 8: Rang-Leela by Rangotri','Surekh','work','10:00','13:00','Vikram Joshi','Experience, skill and appreciation for crafts','','W08'),S('Workshop 9: Understanding the "Law" of Design','Surekh','work','10:00','13:00','Sahibnoor Singh Sidhu','Copyright, Design, Trademark, Tax, Company Incorporation, Agreements and Import/Export','','W09'),S('Workshop 2: 50 Seats, 50 Stories (Session 2)','Surekh','work','14:00','17:00','Sana Soni','Full-scale papier-mâché coffee table. Session 2: Finishing and photoshoot','','W02'),S('Workshop 10: Metalscape','Surekh','work','14:00','17:00','Kamlesh Dal','Jewellery Design Workshop','','W10'),S('Open exhibition','Alankar','exh','11:00','21:00'),S('Make-a-thon (Friends of Figma)','Sudarshan','work','09:00','18:00','','Sustainability, Circularity')]}]};
function m(t){var p=(t||'').split(':');return p.length<2?NaN:+p[0]*60+ +p[1]}
function fmt(x){var h=Math.floor(x/60)%24,mm=x%60;return(h%12||12)+(mm?':'+(mm<10?'0':'')+mm:'')+' '+(h<12?'am':'pm')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ok(x){return m(x.e)>m(x.s)}
function ov(p,q){return p.v===q.v&&m(p.s)<m(q.e)&&m(q.s)<m(p.e)}
function bl(x){var t=x.d;if(!t&&x.p){var ls=x.p.split('\n');for(var i=0;i<ls.length;i++)if(ls[i].trim()&&ls[i].indexOf('||')<0){t=ls[i].trim();break}}return t||''}
var CUR=[];
function openD(i){var x=CUR[i];if(!x)return;var ps='',rows='';
(x.p||'').split('\n').forEach(function(l){l=l.trim();if(!l)return;
if(l.indexOf('||')>=0){var c=l.split('||').map(function(s){return s.trim()});rows+='<li><b>'+esc(c[0])+'</b><span>'+esc(c[1]||'')+'</span><em>'+esc(c[2]||'')+'</em></li>'}else ps+='<p>'+esc(l)+'</p>'});
var meta=fmt(m(x.s))+' – '+fmt(m(x.e))+' · '+esc(x.v)+(x.f?' · '+esc(x.f):'');
var own=(!x.p&&x.d)?'<p>'+esc(x.d)+'</p>':'';
document.getElementById('dbody').innerHTML='<span class="chip '+x.k+'">'+esc(KINDS[x.k]||'')+'</span><h3 id="dtitle">'+esc(x.t)+'</h3><p class="dm">'+meta+'</p>'+ps+own+(rows?'<ul>'+rows+'</ul>':'');
var d=document.getElementById('dlg');if(x.w)document.getElementById('dbody').insertAdjacentHTML('beforeend','<p><button class="lnk" data-w="'+esc(x.w)+'">Full workshop details</button></p>');d.hidden=false;document.body.style.overflow='hidden';document.getElementById('dclose').focus()}

function bk(x,left,w,top,ht,j){var dd=bl(x),has=x.f||dd;return'<div class="blk '+x.k+(has?' has':'')+(w<110?' nar':'')+'" role="button" tabindex="0" data-i="'+j+'" title="'+esc([x.t,x.f,dd].filter(Boolean).join(' · '))+'" style="left:'+left+'px;width:'+w+'px;top:'+top+'px;height:'+ht+'px"><b>'+esc(x.t)+'</b><small>'+(x.f?esc(x.f)+' · ':'')+fmt(m(x.s))+' – '+fmt(m(x.e))+'</small>'+(dd?'<span class="d">'+esc(dd)+'</span>':'')+'</div>'}
var WS=[{"c": "W01", "g": 0, "t": "The Art of Seeing", "f": "Keya Vaswani", "o": "Story of Being", "d": "16 Nov 2026", "tm": "10 AM to 1 PM", "v": "Surekh, Jawahar Kala Kendra", "fee": "₹1,500 per participant", "one": "Film Making (Visual Story Telling, Mobile film making & Editing)", "about": ["A hands-on introduction to filmmaking and visual storytelling. Participants learn to observe their surroundings through a filmmaker's lens, explore Jaipur Design Festival, and turn an interesting moment, object, person or process into a one-minute film using their mobile phones."], "learn": ["How to observe everyday surroundings through a filmmaker's lens and spot the story in a moment, object, person or process.", "How to turn a single observation into a short visual story.", "How to shoot and edit a one-minute film using only a mobile phone.", "How to experience Jaipur Design Festival itself as a source of stories."], "who": "Open for all", "theme": "Visual Storytelling", "req": "Their own mobile phone; sufficient storage and battery for filming and editing.", "incl": "", "prof": ["Keya Vaswani is a National Award-winning filmmaker, Forbes-featured creative, and TED speaker with over 15 years of mastery in visual storytelling. As the founder of Story of Being established in 2013. With over a decade at the intersection of cinematic excellence and deep consciousness, Keya unearths the raw layers of human experience and heritage, cementing her place as a definitive voice in contemporary Indian storytelling.", "Alongside her creative practice, Keya is a passionate educator and mentor. She teaches documentary filmmaking and design, conducting workshops across colleges and creative institutions to nurture emerging storytellers. She has taught at esteemed institutes such as Film and Television Institute of India (FTII), among many others.", "Beyond her cinematic pursuit, Keya is an accomplished Animal & Nature whisperer. She serves as a conduit for interspecies dialogue, reactivating the innate telepathic bond between humans and the living intelligence of the natural world.", "Through Story of Being, Keya bridges creativity and consciousness—whether directing documentaries or guiding telepathic sessions to inspire awareness, empathy, and harmony across people, animals, and nature."], "web": "www.storyofbeing.in", "ig": "@keya.vaswani"}, {"c": "W02", "g": 0, "t": "50 Seats, 50 Stories", "f": "Sana Soni", "o": "Desi Gulaab", "d": "16 Nov 2026 (Session 1) and 18 Nov 2026 (Session 2)", "tm": "2 PM to 5 PM (both sessions)", "v": "Surekh, Jawahar Kala Kendra", "fee": "₹10,500 per participant for both sessions combined", "one": "A two-session design-and-build workshop to create a full-scale coffee table in papier-mâché. Session 1: Form development. Session 2: Finishing and photoshoot.", "about": ["An everyday object, a coffee table, becomes a canvas for memory, imagination, and personal expression. In this two-session design-and-build workshop, participants will start by creating their own full-scale coffee table using papier-mâché, followed by a session dedicated to finishing, painting, and personalising their creations.", "Moving beyond the conventional idea of furniture as a functional object, the workshop invites participants to reflect on objects that hold memories - a childhood toy, a stool, or a familiar corner at home. Through hands-on making, they will explore form, material, colour, and storytelling, translating personal associations into a tangible object.", "The experience is about more than creating a piece of furniture; it is about slowing down, reconnecting with simple materials, and discovering how design can hold stories. Each table becomes a unique expression of its maker: a functional object infused with personal meaning."], "learn": ["How an everyday object like a coffee table can become a canvas for imagination and personal expression.", "How to mould and shape a full-scale table in papier-mâché.", "How to finish, paint and personalise the table so it becomes a unique expression of its maker.", "How to translate personal memories and associations into form, material and colour, and how design can hold stories."], "who": "Open to All", "theme": "Product Design and Prototyping", "req": "All inclusive! Come with good spirits and a willingness to have fun with materials.", "incl": "", "prof": ["Ar. Sana Soni is a Jaipur-based architect, furniture designer and artist, and the founder of Desi Gulaab, an Architecture and multidisciplinary design practice. An alumna of MNIT Jaipur and NID Ahmedabad, her work explores the intersection of architecture, craft, material and storytelling. Passionate about hands-on learning and creative exploration, she brings design thinking into workshops that encourage participants to experiment, build, and discover the joy of making through thoughtful engagement with materials and processes."], "web": "https://www.desigulaab.com", "ig": "@desigulaab"}, {"c": "W03", "g": 0, "t": "Designed storytelling using five senses", "f": "Mannat Bardia, Priyanshi Khatri", "o": "4am Design Space", "d": "16 Nov 2026", "tm": "2 PM to 5 PM", "v": "Surekh, Jawahar Kala Kendra", "fee": "₹1,499 per participant", "one": "Observe, interpret, and communicate stories through multiple sensory layers", "about": ["Jaipur Design Festival brings together designers from diverse disciplines, creating an opportunity for conversations that extend beyond technical skills and individual practices. This workshop offers a cross-disciplinary approach to storytelling by encouraging participants to think beyond the visual and consider how experiences are shaped through all five senses."], "learn": ["How to think beyond the visual and see how experiences are shaped through all five senses.", "How to observe, interpret and communicate a story through multiple sensory layers.", "A cross-disciplinary approach to storytelling that goes beyond technical skills and individual practices."], "who": "College Students, Designers, Professionals, Educators, Entrepreneurs, Beginners", "theme": "Sensory Storytelling", "req": "Nothing", "incl": "A4 sheets/drawing paper, sticky notes, index cards, sketch pens and markers, pens and pencils, everyday sensory objects (textures, scents, packaged food items etc.), masking tape, chart paper/presentation sheets.", "prof": ["Mannat Bardia is a multidisciplinary designer and the founder of 4am Design Space, Jaipur. 4am is a bunch of curious minds who like asking questions, digging deeper, and seeing where an idea can go. From brands and packaging to visual stories and experiences, the team likes getting its hands dirty, experimenting, and finding the little things that make a big difference to how a story is told.", "Priyanshi Khatri gathers little pieces of stories from the quiet beauty of everyday life, letting these moments slowly find their way into her drawings. She finds inspiration in films, stories, and almost every form of creative expression. She loves the colour yellow, the feeling of raindrops, learning new languages, and collecting postcards that feel like tiny worlds waiting to be discovered."], "web": "https://linktr.ee/4amdesignspace", "ig": "@4amdesignspace"}, {"c": "W11", "g": 0, "t": "The Power of Color with Pantone", "f": "Ankita Kothari", "o": "Pantone India", "d": "16 Nov 2026", "tm": "3 PM to 5 PM", "v": "Sudarshan, Jawahar Kala Kendra", "fee": "Free", "one": "", "about": ["Color is more than a visual choice. It is a powerful language that shapes identities, communicates ideas, and influences how we experience design.", "Join Pantone for an engaging session exploring the world of color, the importance of globally recognized color standards, and how designers can bring greater accuracy, consistency, and confidence to their creative process.", "Discover how Pantone's color systems and tools help bridge the gap between creative inspiration and final execution, enabling designers to communicate color effectively across physical and digital environments.", "The session ends with an interactive Pantone color quiz. One lucky winner will receive an exclusive Pantone Color of the Year 2026 limited-edition mug and notebook."], "learn": ["The World of Pantone: An introduction to Pantone and its role as a global color authority.", "Why Color Standards Matter: Understanding the importance of color accuracy, consistency, and a shared color language.", "From Inspiration to Execution: Exploring Pantone tools and resources that help designers select, communicate, and reproduce color with confidence.", "Bridging Physical and Digital Color: A live demonstration of Pantone Connect, showcasing how designers can bring physical Pantone colors into their digital creative workflows.", "Smarter Color Workflows: Practical insights into reducing guesswork, improving collaboration, and streamlining the design-to-production process."], "who": "Graphic designers, fashion and textile designers, interior designers, product designers, design students, and anyone passionate about color and creativity", "theme": "", "req": "Participants are encouraged to bring their curiosity, creativity, and enthusiasm for color! Optional: a laptop, if they wish to explore Pantone Connect during the live demonstration.", "incl": "", "prof": ["Ankita Kothari is a design and business development professional with over 15 years of international experience across the fashion, design, and creative industries.", "An alumna of the National Institute of Fashion Technology (NIFT), Mumbai, and London College of Fashion, she currently leads business development initiatives for Pantone in India, working closely with brands, designers, and industry professionals to promote the importance of color standards and effective color communication.", "Through industry collaborations, educational initiatives, and knowledge-sharing sessions, she is passionate about bridging creativity and technology, helping designers translate their creative vision into consistent, accurate color outcomes."], "web": "www.shoppantone.com", "ig": "@PantoneIndia, @Pantone"}, {"c": "W04", "g": 1, "t": "Stories in Thread", "f": "Sana Soni", "o": "Desi Gulaab", "d": "17 Nov 2026", "tm": "10 AM to 1 PM", "v": "Surekh, Jawahar Kala Kendra", "fee": "₹6,000 per participant", "one": "Embroidery workshop", "about": ["Every family carries memories in everyday things: a favourite artwork, a utensil, a swing, an embroidery, a local sweet, a festival tradition.", "Participants deep dive into nostalgia and translate one such memory onto a canvas. Individually, every piece is meant to tell a personal story. Together, they become a collective archive of shared memories.", "Unlike an embroidery tutorial, the emphasis will not be on technical perfection but on storytelling through different techniques involving thread."], "learn": ["How to translate a personal memory into stitches to create an artwork.", "How to tell a story through thread, with the emphasis on storytelling rather than technical perfection.", "How individual pieces come together as a collective archive of shared memories."], "who": "Open to All", "theme": "Craft and Storytelling", "req": "All inclusive! Come as you are and take home something handmade, something personal and precious.", "incl": "", "prof": ["Ar. Sana Soni is a Jaipur-based architect, furniture designer and artist, and the founder of Desi Gulaab, an Architecture and multidisciplinary design practice. An alumna of MNIT Jaipur and NID Ahmedabad, her work explores the intersection of architecture, craft, material and storytelling. Passionate about hands-on learning and creative exploration, she brings design thinking into workshops that encourage participants to experiment, build, and discover the joy of making through thoughtful engagement with materials and processes."], "web": "https://www.desigulaab.com", "ig": "@desigulaab"}, {"c": "W05", "g": 1, "t": "Character design and Storytelling", "f": "Phani Tetali", "o": "IDC School of Design, IIT Bombay", "d": "17 Nov 2026", "tm": "2 PM to 5 PM", "v": "Surekh, Jawahar Kala Kendra", "fee": "₹1,500 per participant", "one": "Approach towards character design as an integral tool in storytelling", "about": ["The workshop is intended for beginner and intermediate people interested in character design, character development and cartoon illustration, and to use these for storytelling."], "learn": ["How character design works as an integral tool in storytelling.", "The basics of character development and cartoon illustration, at beginner and intermediate level.", "How to use characters to tell stories."], "who": "Designers / Design Students", "theme": "Graphic / Communication Design", "req": "Nothing. JDF will arrange A3/A4 paper, pencils, pens, sketchpens and colour pencils.", "incl": "", "prof": ["Phani Tetali is a cartoonist, illustrator, animator, and animation educator with over 30 years of professional experience spanning industry and academia.", "He is currently a Professor at the IDC School of Design, Indian Institute of Technology (IIT) Bombay, where he has been teaching since 2009. He served as the Head of the IDC School of Design at IIT Bombay from 2019 to 2022.", "Phani Tetali holds a B.Tech from IIT (BHU), Varanasi, and an M.Des in Visual Communication from IDC IIT Bombay. Prior to academia, he spent 18 years in the animation and gaming industries. His contributions have been recognised through multiple national awards for teaching and animation design.", "Phani also features a daily pocket cartoon called \"Life At Large\" in the Mumbai Mirror (A Times of India group daily newspaper)."], "web": "www.phanitetali.com", "ig": "@phanitetali"}, {"c": "W06", "g": 1, "t": "Learning from Children: Rediscovering Natural Intelligence: Rethinking Learning and Creativity in the Age of AI", "f": "Jinan K. B.", "o": "Existential Knowledge Foundation", "d": "17 Nov 2026", "tm": "10 AM to 1 PM", "v": "Surekh, Jawahar Kala Kendra", "fee": "₹1,200 per participant", "one": "Retaining the Designer in the Child; Reawakening the Child in the Adult", "about": ["Retaining the Designer in the Child; Reawakening the Child in the Adult. This experiential workshop begins with a simple question: why can a child do certain things naturally that an educated adult finds surprisingly difficult? Through sensory explorations, observation, drawing, paper work, participants will encounter how education gradually shifts us from direct perception and embodied knowing towards concepts, instructions and predetermined outcomes. Alongside these experiences, participants will examine how children naturally learn through their senses, movement, curiosity, making, experimentation and continuous engagement with the world.", "Rather than teaching techniques for becoming more creative, the workshop invites participants to recognise what has been lost or suppressed in their own ways of seeing, learning and making. The experience offers parents, educators, designers and students an opportunity to rediscover the natural cognitive capacities still visible in children, and to reconsider what education might become if these capacities were protected rather than replaced."], "learn": ["The difference between natural, sensory ways of knowing and the concept-driven ways of learning acquired through education.", "How capacities that come naturally to children, including attention, curiosity, experimentation, aesthetic judgement and learning through direct engagement, often become weakened in adults.", "How to recognise children as autonomous knowledge creators.", "The role of the senses and the body in learning.", "What must be protected, rather than taught, if education is to retain the natural designer in every child."], "who": "Parents, Educators, Design Students, School Students, etc.", "theme": "Learning and Natural Cognition", "req": "This is the set of 6 poster colours required for workshop. JDF will arrange a pencil, 6 sheets of A4 paper and a 6\" scale.", "incl": "", "prof": ["Jinan K. B. is a designer, educator, researcher and author whose four-decade inquiry questions the foundations of modern education. Through sustained engagement with children, craftspeople, non-literate communities and design foundation education, he investigates how schooling, literacy and digital technologies transform natural cognition into conditioned cognitive labour. His work explores design education as perhaps the last modern discipline retaining residues of natural cognition, and therefore as a critical site for recovering cognitive autonomy: the human capacity to perceive, inquire, know and create independently."], "web": "jinankb.in", "ig": "@do_nothing_parenting"}, {"c": "W07", "g": 1, "t": "the AHA MOMENT", "f": "Niraj Shah", "o": "ido design / idograph", "d": "17 Nov 2026", "tm": "2 PM to 5 PM", "v": "Surekh, Jawahar Kala Kendra", "fee": "₹1,000 per participant", "one": "Creative Thinking Workshop", "about": ["The workshop is an immersive engagement that starts by establishing how \"words\" are mere representation of \"concepts\" through a simple visual-memory-association & representation based exercise, followed by an 'epiphany' experience through unprecedented combination of dissociated words, coming together by chance as well as by intention, to generate new concepts never seen and imagined before. These concepts are the final feeling of a eureka or AHA moment."], "learn": ["How words are mere representations of concepts, through a simple visual-memory-association and representation exercise.", "How the connection between words and concepts shapes the creative process.", "How combining dissociated words, by chance as well as by intention, can lead to an 'epiphany' experience.", "How to generate new concepts never seen or imagined before.", "The feeling of a eureka or AHA moment."], "who": "Open for all", "theme": "Creative Thinking", "req": "Sketch books, pen/pencil/loose blank A5 size paper", "incl": "", "prof": ["Niraj Shah is a CEPT-trained designer, TEDx speaker and co-founder of IDO design and IDOgraph. His multidisciplinary experience spans interiors, branding, cinema, academics and leadership. He received the Gujarat State Award for Art Direction for Bey Yaar and served on India's Oscars selection panel for 2020. A former IIID Ahmedabad Chairperson and National Executive Committee member, he serves on UID's Board of Studies and is a founding committee member of RDI India. His Ahmedabad-based practice, co-founded with Minali Verma, integrates brand strategy, identity, packaging, interiors and customer experience for retail, hospitality, real-estate and interior-architecture brands within a cohesive design ecosystem."], "web": "", "ig": "@idodesignindia, @nirajsha, @idographindia"}, {"c": "W08", "g": 2, "t": "Rang-Leela by Rangotri", "f": "Vikram Joshi", "o": "Rangotri Atelier", "d": "18 Nov 2026", "tm": "10 AM to 1 PM", "v": "Surekh, Jawahar Kala Kendra", "fee": "₹5,310 per participant", "one": "Experience, skill and appreciation for crafts", "about": ["The students will explore the making of a block into a finished product, which they can take back home."], "learn": ["Discover the Craft — Explore the history and heritage of traditional Indian block printing.", "Meet the Makers — Learn about the wooden blocks, colours, and techniques from skilled artisans.", "Print by Hand — Get hands-on experience layering colours and creating beautiful patterns on fabric.", "Create Your Own — Experiment with designs and take home a uniquely printed creation of your own."], "who": "School Students, College Students, Designers, Professionals, Educators, Craftspeople, Entrepreneurs", "theme": "Textile Craft", "req": "Old shirt, dupatta, scarves to print.", "incl": "", "prof": ["Mr. Vikram Joshi is a textile technologist and craft advocate with over four decades of experience in documenting, promoting, and preserving India’s rich textile heritage. He has played a significant role in securing Geographical Indication (GI) recognition for Sanganeri Print and founded Rangotri, a Sanganer-based enterprise that brings handcrafted Indian textiles to markets worldwide. He also helped establish Jaipur Bloc, a sustainable textile park near Bagru recognised for its environmentally responsible practices. Through his work, he continues to mentor artisans, students, and institutions in India and internationally, fostering a deeper understanding and appreciation of India’s textile traditions."], "web": "www.rangotri.com", "ig": "@rangotri / @blockprintworkshop"}, {"c": "W09", "g": 2, "t": "Understanding the \"Law\" of Design", "f": "Sahibnoor Singh Sidhu", "o": "artlawyer.in", "d": "18 Nov 2026", "tm": "10 AM to 1 PM", "v": "Surekh, Jawahar Kala Kendra", "fee": "₹1,499 per participant", "one": "A Masterclass on laws including Copyright, Design, Trademark, Tax, Company Incorporation, Agreements and Import/Export.", "about": ["The workshop will be an expert masterclass over the course of roughly 2 hours, where Sahibnoor Singh Sidhu will explain and differentiate between Copyright, Trademark, and the Design Act. This is to not only ensure that the designs created by the designers are protected from unlicensed copying, but also that the underlying documents, including drawings, remain protected, as well as their practises and studios remaining immune from similarly named copycats."], "learn": ["How copyright, trademark and the Design Act differ from one another.", "How designs are protected from unlicensed copying.", "How the underlying documents, including drawings, remain protected.", "How practices and studios can stay immune from similarly named copycats.", "An expert masterclass on the laws that touch design: copyright, import/export, intellectual property, trademark and dispute resolution."], "who": "School Students, College Students, Designers, Professionals, Craftspeople, Entrepreneurs, Beginners, Advanced Participants", "theme": "Design and the Law", "req": "Nothing", "incl": "", "prof": ["Sahibnoor Singh Sidhu is an art lawyer and academic based out of New Delhi and Berlin. He advises galleries, museums, artists, artisans, festivals and cultural start ups on being legally compliant in India. He is also a faculty member at Jindal Global Law School. He holds a bachelor's degree in law from India and a master's from the University of Toronto."], "web": "https://artlawyer.in/", "ig": "@artlawyer.in"}, {"c": "W10", "g": 2, "t": "Metalscape", "f": "Kamlesh Dal", "o": "Dal Design Academy", "d": "18 Nov 2026", "tm": "2 PM to 5 PM", "v": "Surekh, Jawahar Kala Kendra", "fee": "₹900 per participant", "one": "Jewellery Design Workshop", "about": ["Metalscape: Design Your Story is an immersive hands-on jewellery design workshop that introduces participants to the exciting world of design, creativity, craftsmanship, and sustainability. Members explore the fundamentals of jewellery design while creating their own contemporary jewellery using metal components, charms, chains, beads, and mixed materials. Through experimentation with colour, texture, balance, rhythm, proportion, and composition, participants transform simple elements into meaningful wearable art that reflects their personal stories."], "learn": ["The fundamentals of jewellery design.", "How to create their own contemporary jewellery using metal components, charms, chains, beads and mixed materials.", "How colour, texture, balance, rhythm, proportion and composition shape a design.", "How simple elements can become meaningful wearable art that reflects their personal stories.", "An introduction to the world of design, creativity, craftsmanship and sustainability."], "who": "School Students, College Students, Designers, Professionals, Educators, Craftspeople, Entrepreneurs, Government Officials, Citizens, Families, Beginners", "theme": "Jewellery Design", "req": "Basic stationery (A4 sheets, pens, markers) if needed", "incl": "", "prof": ["Kamlesh Dal is the Founder & CEO of DAL Design Academy, one of India's leading institutes dedicated to nurturing creativity, craftsmanship, and innovation in jewelry design, and the owner of Zokazi Jewels. With over a decade of experience in manual and CAD jewelry designing, Kamlesh specializes in transforming ideas into elegant, meaningful, and wearable art.", "Kamlesh is also the Founder of Zokazi Jewels, a brand committed to blending luxury aesthetics with high-quality craftsmanship offering both premium and affordable designer jewelry collections.", "Awards & recognitions: Jewels of Rajasthan – Best Jewelry Designing Award (2018); Chanakya Best Teacher Award (2022); Director of the Year (2024); Adamya Nari Ratna Samman (2025); Felicitated by Jaipur Jewellery Design Festival at JJS 2025; Young Researcher Award (2026).", "Kamlesh also serves as an External Examiner and Jury Member for multiple universities and design institutions supporting high academic and industry standards. As a Researcher in Computer Science, Kamlesh explores the intersection of technology, AI, and design, presenting research at international conferences in Dubai, London, Vietnam, and Goa.", "Proud member of ADI (Association of Designers of India), RAMA (Rajasthan Animation & Multimedia Association), VFX, and Animation Rajasthan, and Vice President of BOND (Business Owners Network & Development)."], "web": "https://www.daldesignacademy.com/", "ig": "@daldesignacademy"}];

var gd=document.getElementById('grid');
gd.addEventListener('click',function(e){var b=e.target.closest('.blk');if(b)openD(+b.getAttribute('data-i'))});
gd.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var b=e.target.closest('.blk');if(b){e.preventDefault();openD(+b.getAttribute('data-i'))}});
document.getElementById('dclose').addEventListener('click',closeD);
document.getElementById('dbody').addEventListener('click',function(e){var b=e.target.closest('[data-w]');if(b){closeD();showW(b.getAttribute('data-w'))}});
document.getElementById('dlg').addEventListener('click',function(e){if(e.target.id==='dlg')closeD()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeD()});
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(grid,120)});
tabs();grid();
</script>
